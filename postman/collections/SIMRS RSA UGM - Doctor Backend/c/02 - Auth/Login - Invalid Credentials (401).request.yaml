$kind: http-request
method: POST
url: '{{base_url}}/api/auth/login'
order: 2000
auth:
  type: noauth
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "user_nm": "invalid_user_check",
      "password": "wrong_password_check"
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('Status 401 untuk kredensial salah atau user tidak ditemukan', () => {
        pm.response.to.have.status(401);
      });

      pm.test('Pesan error generik identik sesuai CONTEXT.md', () => {
        const body = pm.response.json();
        pm.expect(body.message).to.eql('Username atau password salah');
      });

