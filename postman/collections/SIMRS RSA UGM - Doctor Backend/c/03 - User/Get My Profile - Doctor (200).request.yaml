$kind: http-request
method: GET
url: '{{base_url}}/api/users/me'
order: 2000
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('Status 200 untuk profil dokter terautentikasi', () => {
        pm.response.to.have.status(200);
      });

      pm.test('Respons hanya berisi field profil dokter yang diizinkan (tanpa NIK/pwd0)', () => {
        const body = pm.response.json();
        pm.expect(body).to.have.all.keys(
          'user_id',
          'user_nm',
          'person_id',
          'display_name',
          'profession_id',
          'profession_nm',
          'org_id'
        );
        pm.expect(body).to.not.have.any.keys('nik', 'ext_id', 'pwd0', 'pwd1');
      });

