$kind: http-request
method: GET
url: '{{base_url}}/health'
order: 1000
auth:
  type: noauth
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('Status 200 OK', () => {
        pm.response.to.have.status(200);
      });

      pm.test('Response mengembalikan { status: "ok" }', () => {
        const body = pm.response.json();
        pm.expect(body).to.eql({ status: 'ok' });
      });

